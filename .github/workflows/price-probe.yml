# تجربة مؤقتة: هل مواقع الأخبار الليبية (أسعار الكسر) تنفتح من سيرفرات GitHub؟ (Supabase محجوب عندهم)
name: price-probe
on:
  push:
    branches: [claude/repair-tracking-app-ouzfmo]
    paths: [.github/workflows/price-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://www.libyaakhbar.com/business-news/2924500.html https://almashhadlibya.com/economic-news/currency-prices/140710 https://www.libyaakhbar.com/; do
            code=$(curl -s -m 25 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o page.html -w "%{http_code}" "$u")
            echo "$code $(grep -o 'كسر' page.html | wc -l) kasr-mentions  $u  $(head -c 80 page.html | tr -d '\n')"
          done
